/* ═══════════════════════════════════════════════════════════════
   wabi · design tokens
   Light is default. Dark via [data-theme="dark"] on <html>.
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ── BRAND ── */
  --brand-50:  #eef0f7;
  --brand-100: #dde2ed;
  --brand-200: #b8c0d8;
  --brand-300: #8e9bc1;
  --brand-400: #7280b0;
  --brand-500: #5b6ca3;   /* wabi blue (preserved) */
  --brand-600: #4d5b8a;
  --brand-700: #3f4a73;
  --brand-800: #313a5c;
  --brand-900: #232940;

  /* ── SEMANTIC NEUTRALS (light) ── */
  --bg:          #f1f1ee;       /* neutral canvas */
  --bg-elev-0:   #fbfbf9;       /* elevated card / sheet */
  --bg-elev-1:   #f6f6f3;       /* control / recessed surface */
  --bg-elev-2:   #eaeae6;       /* sidebar / toolbar surface */
  --bg-hover:    rgba(28,30,36,.060);
  --bg-press:    rgba(28,30,36,.095);
  --bg-selected: rgba(91,108,163,.13);

  --hairline:       rgba(28,30,36,.115);
  --hairline-soft:  rgba(28,30,36,.072);
  --hairline-strong:rgba(28,30,36,.205);

  --text:        #202126;
  --text-muted:  #6b6d75;
  --text-faint:  #9799a1;
  --text-on-brand: #ffffff;

  /* ── BLOCK ACCENTS (de-saturated, harmonised) ── */
  --blk-a-bg:     #fbf5e6;
  --blk-a-fg:     #8a6a1c;
  --blk-a-border: #e6d390;
  --blk-b-bg:     #ecf6ef;
  --blk-b-fg:     #2a6e48;
  --blk-b-border: #a4d3b6;
  --blk-c-bg:     #eef2fb;
  --blk-c-fg:     #2c4789;
  --blk-c-border: #a8b9e0;
  --blk-d-bg:     #f2ecf7;
  --blk-d-fg:     #5d3690;
  --blk-d-border: #c5acdc;
  --blk-n-bg:     transparent;
  --blk-n-fg:     var(--text-muted);

  /* ── INTENT (relax/intense) ── */
  --relax-bg:     #e6f1fb;
  --relax-fg:     #1f5fa3;
  --intense-bg:   #fbeae6;
  --intense-fg:   #b53919;

  /* ── DESTRUCTIVE / SUCCESS ── */
  --danger-500:   #d93f3f;
  --danger-600:   #b53919;
  --success-500:  #1f9d62;

  /* ── RADII ── */
  --r-1: 4px;
  --r-2: 6px;
  --r-3: 8px;
  --r-4: 10px;
  --r-5: 14px;
  --r-6: 20px;
  --r-pill: 999px;

  /* ── SHADOWS — stacked, hairline-friendly ── */
  --sh-1: 0 1px 1px rgba(28,30,36,.055), 0 2px 5px rgba(28,30,36,.055);
  --sh-2: 0 1px 2px rgba(28,30,36,.06), 0 7px 18px rgba(28,30,36,.09);
  --sh-3: 0 2px 4px rgba(28,30,36,.07), 0 16px 38px rgba(28,30,36,.13);
  --sh-pop: 0 0 0 1px rgba(28,30,36,.075), 0 18px 46px rgba(28,30,36,.17);

  /* ── MOTION ── */
  --t-instant: 80ms ease;
  --t-fast:    140ms cubic-bezier(.4,0,.2,1);
  --t-base:    220ms cubic-bezier(.4,0,.2,1);
  --t-slow:    320ms cubic-bezier(.4,0,.2,1);

  /* ── TYPOGRAPHY ── */
  --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-brand: "Archivo Black", "Inter", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-serif:"Inter", system-ui, sans-serif;

  --fs-9:  9px;
  --fs-10: 10px;
  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-15: 15px;
  --fs-17: 17px;
  --fs-22: 22px;
  --fs-28: 28px;
  --fs-34: 34px;

  /* ── LAYOUT ── */
  --sidebar-w:   232px;
  --header-h:    48px;
  --detail-w:    340px;
  --gutter-w:    56px;
  --row-h:       44px;
  --tabbar-h:    62px;
}

/* ═══ DARK ═══ */
[data-theme="dark"] {
  --bg:          #181a1e;
  --bg-elev-0:   #292c32;
  --bg-elev-1:   #24272c;
  --bg-elev-2:   #202329;
  --bg-hover:    rgba(255,255,255,.070);
  --bg-press:    rgba(255,255,255,.115);
  --bg-selected: rgba(142,155,193,.20);

  --hairline:       rgba(255,255,255,.115);
  --hairline-soft:  rgba(255,255,255,.072);
  --hairline-strong:rgba(255,255,255,.20);

  --text:        #f0f1f3;
  --text-muted:  #a8aab1;
  --text-faint:  #747780;

  --blk-a-bg:     rgba(230,211,144,.12);
  --blk-a-fg:     #e6d390;
  --blk-a-border: rgba(230,211,144,.35);
  --blk-b-bg:     rgba(164,211,182,.10);
  --blk-b-fg:     #a4d3b6;
  --blk-b-border: rgba(164,211,182,.35);
  --blk-c-bg:     rgba(168,185,224,.10);
  --blk-c-fg:     #b8c5e6;
  --blk-c-border: rgba(168,185,224,.35);
  --blk-d-bg:     rgba(197,172,220,.10);
  --blk-d-fg:     #c5acdc;
  --blk-d-border: rgba(197,172,220,.35);

  --relax-bg:     rgba(106,177,255,.16);
  --relax-fg:     #a8caff;
  --intense-bg:   rgba(255,133,133,.16);
  --intense-fg:   #ffa8a8;

  --sh-1: 0 1px 2px rgba(0,0,0,.25), 0 3px 7px rgba(0,0,0,.20);
  --sh-2: 0 2px 4px rgba(0,0,0,.26), 0 9px 22px rgba(0,0,0,.28);
  --sh-3: 0 3px 7px rgba(0,0,0,.30), 0 18px 42px rgba(0,0,0,.38);
  --sh-pop: 0 0 0 1px rgba(255,255,255,.075), 0 22px 52px rgba(0,0,0,.48);
}
/* ═══════════════════════════════════════════════════════════════
   wabi · base + layout
   Desktop-first (≥1024). Mobile in mobile.css.
   ═══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-13);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}

button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 1px; border-radius: var(--r-2); }

/* ───────── APP SHELL ───────── */
.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}

/* ───────── TITLEBAR ───────── */
.titlebar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: var(--bg-elev-2);
  border-bottom: 1px solid var(--hairline);
  position: relative;
  z-index: 50;
  user-select: none;
}
.titlebar-left  { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.titlebar-right { display: flex; align-items: center; gap: 6px; }

/* Brand mark — uses the cleaned PNG */
.brand-mark {
  display: flex; align-items: baseline; gap: 6px;
  height: 28px; flex-shrink: 0;
  padding: 0 4px;
  user-select: none;
}
.brand-wordmark {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
  line-height: 1;
}
.brand-wordmark .brand-bracket { color: var(--brand-500); font-weight: 500; }
.brand-tagline {
  font-family: var(--font-serif);
  font-size: 11px;
  font-style: italic;
  color: var(--text-muted);
  line-height: 1;
  letter-spacing: 0;
}
.brand-tagline-by { font-style: normal; opacity: .7; margin-right: 1px; }

/* Date nav */
.date-nav.only-desktop,
.date-nav {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-3);
  box-shadow: var(--sh-1);
  white-space: nowrap;
  flex-shrink: 0;
  flex-wrap: nowrap;
}
.btn-date-arrow {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-2);
  color: var(--text-muted);
  font-size: 13px;
  transition: background var(--t-fast), color var(--t-fast);
}
.btn-date-arrow:hover { background: var(--bg-hover); color: var(--text); }
.btn-date-arrow:active { background: var(--bg-press); }

.btn-today {
  height: 24px;
  padding: 0 10px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  border-radius: var(--r-2);
  transition: background var(--t-fast);
}
.btn-today:hover { background: var(--bg-hover); }
.btn-today:active { background: var(--bg-press); }

.date-nav-label {
  height: 24px;
  padding: 0 10px 0 8px;
  display: inline-flex; align-items: center;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  border-left: 1px solid var(--hairline-soft);
  margin-left: 2px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.current-date {
  padding: 0 10px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  min-width: 138px;
  text-align: center;
}

/* Segmented control (Todo/Pendientes) */
.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-3);
  box-shadow: inset 0 1px 0 rgba(0,0,0,.02);
}
.seg-btn {
  height: 24px;
  padding: 0 10px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text-muted);
  border-radius: var(--r-2);
  transition: background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast);
  white-space: nowrap;
}
.seg-btn:hover { color: var(--text); }
.seg-btn[aria-pressed="true"] {
  background: var(--bg-elev-0);
  color: var(--text);
  box-shadow: var(--sh-1);
}

/* Mode pill (intent) */
.mode-pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  box-shadow: var(--sh-1);
  transition: background var(--t-fast), border-color var(--t-fast);
}
.mode-pill:hover { background: var(--bg-elev-1); }
.mode-pill .mode-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-faint);
  transition: background var(--t-base);
}
.mode-pill[data-mode="relax"]   .mode-dot { background: var(--relax-fg); }
.mode-pill[data-mode="intense"] .mode-dot { background: var(--intense-fg); }
.mode-pill[data-mode="relax"]   { background: var(--relax-bg);   border-color: transparent; color: var(--relax-fg); }
.mode-pill[data-mode="intense"] { background: var(--intense-bg); border-color: transparent; color: var(--intense-fg); }
.mode-pill .caret { font-size: 8px; opacity: .6; }

/* Toolbar icon button */
.tb-icon {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-2);
  color: var(--text-muted);
  font-size: 14px;
  transition: background var(--t-fast), color var(--t-fast);
}
.tb-icon:hover { background: var(--bg-hover); color: var(--text); }
.tb-icon:active { background: var(--bg-press); }

.btn-burger { display: none; }

/* ───────── MAIN GRID ───────── */
.main {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 0;
  overflow: hidden;
}

/* ───────── SIDEBAR ───────── */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--bg-elev-2);
  border-right: 1px solid var(--hairline);
  padding: 8px 8px 12px;
  overflow-y: auto;
  min-height: 0;
}
.sidebar-section {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 12px 8px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 6px 8px;
  border-radius: var(--r-2);
  font-size: var(--fs-13);
  font-weight: 400;
  color: var(--text);
  text-align: left;
  transition: background var(--t-fast);
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item:active { background: var(--bg-press); }
.nav-item.is-active {
  background: var(--bg-selected);
  color: var(--text);
  font-weight: 500;
}
.nav-item .nav-icon {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  flex-shrink: 0;
  font-size: 13px;
}
.nav-item.is-active .nav-icon { color: var(--brand-500); }
.nav-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge-soon {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 2px 6px;
  border-radius: var(--r-pill);
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  color: var(--text-faint);
  text-transform: uppercase;
}

.sidebar-footer { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }

/* Push-button language (bordered neutral) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  font-size: var(--fs-12);
  font-weight: 500;
  border-radius: var(--r-3);
  background: var(--bg-elev-0);
  color: var(--text);
  border: 1px solid var(--hairline);
  box-shadow: var(--sh-1);
  transition: background var(--t-fast), transform var(--t-instant), box-shadow var(--t-fast);
}
.btn:hover { background: var(--bg-elev-1); }
.btn:active { transform: translateY(0.5px); box-shadow: none; background: var(--bg-press); }

.btn--primary {
  background: var(--brand-500);
  color: var(--text-on-brand);
  border-color: transparent;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 1px 2px rgba(91,108,163,.30), inset 0 0.5px 0 rgba(255,255,255,.18);
}
.btn--primary:hover { background: var(--brand-600); }
.btn--primary:active { background: var(--brand-700); transform: translateY(0.5px); }

.btn--destructive {
  background: var(--bg-elev-0);
  color: var(--danger-500);
  border-color: var(--hairline);
}
.btn--destructive:hover { background: var(--danger-500); color: #fff; border-color: transparent; }

.btn--ghost {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--text-muted);
}
.btn--ghost:hover { background: var(--bg-hover); color: var(--text); }

.btn--full { width: 100%; }
.btn--block { justify-content: flex-start; }

.btn-flowneuro {
  background: var(--brand-500);
  color: #fff;
  border: 1px solid var(--brand-600);
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 1px 2px rgba(91,108,163,.30), inset 0 0.5px 0 rgba(255,255,255,.18);
  font-weight: 500;
}
.btn-flowneuro:hover { background: var(--brand-600); }
.fn-flow  { font-family: var(--font-serif); font-style: italic; }
.fn-neuro { font-weight: 700; }

/* ───────── CONTENT AREA ───────── */
.content {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: var(--bg);
}

/* ───────── BOARD ───────── */
.board {
  display: grid;
  grid-template-rows: auto 1fr;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.board-headers {
  display: grid;
  grid-template-columns: var(--gutter-w) repeat(7, minmax(140px, 1fr));
  background: var(--bg-elev-0);
  border-bottom: 1px solid var(--hairline);
  position: sticky;
  top: 0;
  z-index: 20;
}
.gutter-head { border-right: 1px solid var(--hairline-soft); }
.day-head {
  padding: 8px 12px 10px;
  border-right: 1px solid var(--hairline-soft);
  display: flex; flex-direction: column; gap: 4px;
}
.day-head:last-child { border-right: none; }
.day-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.day-name { font-size: var(--fs-10); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
.day-num  { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1; }
.day-num--today {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px;
  padding: 0 6px;
  background: var(--brand-500);
  color: #fff;
  border-radius: var(--r-pill);
  font-size: var(--fs-12);
  font-weight: 700;
}
.day-progress {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-10);
  color: var(--text-faint);
}
.progress-track {
  flex: 1;
  height: 3px;
  background: var(--hairline-soft);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--success-500);
  border-radius: var(--r-pill);
  transition: width var(--t-slow);
}

/* Board body — grid: same template as headers, so columns stay aligned */
.board-body {
  display: grid;
  grid-template-columns: var(--gutter-w) repeat(7, minmax(140px, 1fr));
  overflow-y: auto;
  overflow-x: auto;
  position: relative;
}

/* Time gutter — sticky LEFT */
.gutter {
  grid-column: 1;
  grid-row: 1;
  border-right: 1px solid var(--hairline-soft);
  position: sticky;
  left: 0;
  background: var(--bg-elev-0);
  z-index: 10;
}
.gutter-cell {
  height: var(--row-h);
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 4px 6px 0 0;
  font-size: var(--fs-10);
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--hairline-soft);
  background: var(--bg-elev-0);
}
.gutter-cell.blk-a { color: var(--blk-a-fg); background: var(--blk-a-bg); }
.gutter-cell.blk-b { color: var(--blk-b-fg); background: var(--blk-b-bg); }
.gutter-cell.blk-c { color: var(--blk-c-fg); background: var(--blk-c-bg); }
.gutter-cell.blk-d { color: var(--blk-d-fg); background: var(--blk-d-bg); }

/* Day columns */
.day-col {
  grid-row: 1;
  border-right: 1px solid var(--hairline-soft);
  position: relative;
  display: flex;
  flex-direction: column;
}
.day-col:last-child { border-right: none; }

/* Hour rows — empty backdrop, identical heights to gutter-cell */
.hour-rows { display: flex; flex-direction: column; }
.hour-row {
  height: var(--row-h);
  border-bottom: 1px solid var(--hairline-soft);
  flex-shrink: 0;
}
.hour-row.blk-a { background: var(--blk-a-bg); }
.hour-row.blk-b { background: var(--blk-b-bg); }
.hour-row.blk-c { background: var(--blk-c-bg); }
.hour-row.blk-d { background: var(--blk-d-bg); }

/* Block sections — overlaid via absolute, anchored to their start hour */
.block-section {
  position: absolute;
  left: 0; right: 0;
  padding: 4px 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: none; /* let bg row clicks pass through */
}
.block-section > * { pointer-events: auto; }
.block-label {
  font-size: var(--fs-9);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 2px 6px;
  border-radius: var(--r-1);
  width: fit-content;
  background: var(--bg-elev-0);
  border: 1px solid currentColor;
  opacity: .7;
}
.block-label.blk-a { color: var(--blk-a-fg); border-color: var(--blk-a-border); }
.block-label.blk-b { color: var(--blk-b-fg); border-color: var(--blk-b-border); }
.block-label.blk-c { color: var(--blk-c-fg); border-color: var(--blk-c-border); }
.block-label.blk-d { color: var(--blk-d-fg); border-color: var(--blk-d-border); }

.tasks-stack {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Task card — hi-fi system UI feel */
.task-card {
  position: relative;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-3);
  padding: 7px 9px 7px 11px;
  box-shadow: var(--sh-1);
  cursor: default;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-instant), box-shadow var(--t-fast);
}
.task-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: var(--r-3) 0 0 var(--r-3);
  background: var(--text-faint);
  opacity: .55;
}
.task-card.blk-a::before { background: var(--blk-a-border); opacity: 1; }
.task-card.blk-b::before { background: var(--blk-b-border); opacity: 1; }
.task-card.blk-c::before { background: var(--blk-c-border); opacity: 1; }
.task-card.blk-d::before { background: var(--blk-d-border); opacity: 1; }

.task-card:hover { border-color: var(--hairline-strong); box-shadow: var(--sh-2); }
.task-card.is-selected {
  border-color: var(--brand-500);
  box-shadow: 0 0 0 2px rgba(91,108,163,.18), var(--sh-1);
}
.task-card.is-done { opacity: .55; }
.task-card.is-done .task-title { text-decoration: line-through; color: var(--text-muted); }

.task-row { display: flex; align-items: flex-start; gap: 8px; }
.task-check {
  width: 16px; height: 16px;
  flex-shrink: 0;
  margin-top: 1px;
  border-radius: 50%;
  border: 1.5px solid var(--hairline-strong);
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast);
}
.task-check:hover { border-color: var(--brand-500); }
.task-check.is-done {
  background: var(--success-500);
  border-color: var(--success-500);
  animation: pop var(--t-fast);
}
.task-check.is-done::after {
  content: ''; width: 8px; height: 4px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translate(0px, -1px);
}

.task-title {
  flex: 1;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  line-height: 1.35;
  word-break: break-word;
  min-width: 0;
}

.task-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
  margin-left: 24px;
}
.tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--fs-10);
  font-weight: 500;
  color: var(--text-muted);
}
.tag-dot { width: 7px; height: 7px; border-radius: 50%; }

.chip-mini {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--fs-10);
  font-weight: 500;
  padding: 1px 6px;
  border-radius: var(--r-pill);
  background: var(--bg-elev-1);
  color: var(--text-muted);
  border: 1px solid var(--hairline-soft);
}
.chip-mini.is-relax   { background: var(--relax-bg);   color: var(--relax-fg);   border-color: transparent; }
.chip-mini.is-intense { background: var(--intense-bg); color: var(--intense-fg); border-color: transparent; }

/* Card delete (desktop hover) */
.card-actions {
  position: absolute;
  top: 4px; right: 4px;
  display: flex;
  gap: 2px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-fast);
}
.task-card:hover .card-actions { opacity: 1; pointer-events: auto; }
.btn-card-action {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-2);
  color: var(--text-muted);
  font-size: 11px;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  box-shadow: var(--sh-1);
  transition: background var(--t-fast), color var(--t-fast);
}
.btn-card-action:hover { color: var(--danger-500); background: var(--bg-elev-1); }

/* Empty state inside columns */
.col-empty {
  margin: 8px 6px 0;
  padding: 8px;
  border: 1px dashed var(--hairline);
  border-radius: var(--r-3);
  font-size: var(--fs-11);
  color: var(--text-faint);
  text-align: center;
}

/* ───────── FAB ───────── */
.fab {
  position: absolute;
  bottom: 18px; right: 18px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--brand-500);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  font-weight: 300;
  line-height: 1;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 8px 22px rgba(91,108,163,.45), inset 0 0.5px 0 rgba(255,255,255,.20);
  transition: transform var(--t-fast), background var(--t-fast);
  z-index: 30;
}
.fab:hover { background: var(--brand-600); transform: translateY(-1px); }
.fab:active { transform: translateY(0px) scale(.96); }

/* ───────── DETAIL PANEL ───────── */
.detail {
  width: 0;
  background: var(--bg-elev-0);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-left: 1px solid transparent;
  transition: width var(--t-base), border-color var(--t-base);
  position: relative;
  z-index: 25;
}
.detail.is-open {
  width: var(--detail-w);
  border-left-color: var(--hairline);
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--hairline);
  background: var(--bg-elev-2);
  flex-shrink: 0;
}
.detail-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.detail-date {
  font-size: var(--fs-12);
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.detail-header-actions { display: flex; align-items: center; gap: 2px; }
.detail-back-mobile { display: none; }
@media (max-width: 768px) {
  .detail-back-mobile { display: flex; }
  .detail-nav-desktop { display: none; }
  .detail-close-desktop { display: none; }
}

.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 20px;
  display: flex; flex-direction: column; gap: 16px;
}

.detail-title-input {
  width: 100%;
  font-size: var(--fs-17);
  font-weight: 600;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  padding: 4px 0;
  border-bottom: 1px solid transparent;
  transition: border-color var(--t-fast);
}
.detail-title-input:focus { border-bottom-color: var(--brand-500); }
.detail-title-input::placeholder { color: var(--text-faint); font-weight: 400; }

.section-label {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}

/* Timer */
.timer-card {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: center;
  padding: 12px;
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-4);
}
.timer-cell { text-align: center; min-width: 0; }
.timer-cell-label {
  font-size: var(--fs-9);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-faint);
  margin-bottom: 3px;
}
.timer-cell-val {
  font-size: var(--fs-22);
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
  transition: color var(--t-base);
}
.timer-cell-val.is-running { color: var(--success-500); }
.btn-timer {
  height: 32px;
  padding: 0 14px;
  border-radius: var(--r-3);
  background: var(--brand-500);
  color: #fff;
  font-size: var(--fs-12);
  font-weight: 600;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 1px 2px rgba(91,108,163,.30), inset 0 0.5px 0 rgba(255,255,255,.18);
  transition: background var(--t-fast);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-timer:hover { background: var(--brand-600); }
.btn-timer.is-running { background: var(--danger-500); }
.btn-timer.is-running:hover { background: var(--danger-600); }

/* Meta chips (detail) */
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.meta-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px;
  padding: 0 10px;
  font-size: var(--fs-12);
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  color: var(--text);
  cursor: pointer;
  transition: background var(--t-fast), border-color var(--t-fast);
  user-select: none;
  white-space: nowrap;
}
.meta-chip:hover { background: var(--bg-hover); border-color: var(--hairline-strong); }
.meta-chip i { font-size: 11px; color: var(--text-muted); }
.meta-chip.is-set { color: var(--brand-500); border-color: rgba(91,108,163,.4); background: var(--brand-50); }
[data-theme="dark"] .meta-chip.is-set { background: rgba(91,108,163,.20); border-color: rgba(142,155,193,.5); color: #c5cee8; }

/* Subtasks */
.subtask-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--hairline-soft);
}
.subtask-row:last-child { border-bottom: none; }
.subtask-check {
  width: 14px; height: 14px;
  flex-shrink: 0;
  border: 1.5px solid var(--hairline-strong);
  border-radius: var(--r-1);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast);
}
.subtask-check:hover { border-color: var(--brand-500); }
.subtask-check.is-done {
  background: var(--success-500);
  border-color: var(--success-500);
}
.subtask-check.is-done::after {
  content: ''; width: 6px; height: 3px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg);
}
.subtask-text {
  flex: 1;
  font-size: var(--fs-13);
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
  padding: 2px 0;
}
.subtask-text.is-done { text-decoration: line-through; color: var(--text-muted); }
.subtask-delete {
  opacity: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  font-size: 11px;
  border-radius: var(--r-1);
  transition: opacity var(--t-fast), color var(--t-fast), background var(--t-fast);
}
.subtask-row:hover .subtask-delete { opacity: 1; }
.subtask-delete:hover { color: var(--danger-500); background: var(--bg-hover); }

.btn-subtask-add {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 0;
  font-size: var(--fs-12);
  color: var(--text-muted);
  transition: color var(--t-fast);
}
.btn-subtask-add:hover { color: var(--text); }

.subtask-input-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0;
  border-bottom: 1.5px solid var(--brand-500);
}
.subtask-input-row input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: var(--fs-13);
  color: var(--text);
}

/* Detail footer (delete) */
.detail-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--hairline);
  background: var(--bg-elev-1);
  flex-shrink: 0;
}

/* ───────── POPOVER ───────── */
.popover {
  position: fixed;
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
  border-radius: var(--r-4);
  box-shadow: var(--sh-pop);
  z-index: 950;
  overflow: hidden;
  min-width: 200px;
  animation: popoverIn var(--t-fast) both;
}
.popover-list { padding: 4px; }
.popover-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-radius: var(--r-2);
  font-size: var(--fs-13);
  color: var(--text);
  cursor: pointer;
  transition: background var(--t-fast);
  user-select: none;
}
.popover-item:hover { background: var(--bg-selected); color: var(--text); }
.popover-item.is-selected { background: var(--bg-selected); }
.popover-item .check {
  width: 12px; height: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--brand-500);
}
.popover-item:not(.is-selected) .check { visibility: hidden; }
.popover-divider { height: 1px; background: var(--hairline-soft); margin: 4px 0; }
.popover-section-label {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 8px 10px 4px;
}
.popover-destructive { color: var(--danger-500) !important; }
.popover-destructive:hover { background: rgba(217,63,63,.12) !important; }

/* Time presets */
.time-presets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 8px;
}
.time-preset {
  height: 32px;
  font-size: var(--fs-12);
  font-weight: 500;
  border-radius: var(--r-2);
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  color: var(--text);
  font-variant-numeric: tabular-nums;
  transition: background var(--t-fast), border-color var(--t-fast);
}
.time-preset:hover { background: var(--bg-hover); border-color: var(--hairline-strong); }
.time-preset.is-selected { background: var(--brand-500); color: #fff; border-color: transparent; }

/* Mini calendar */
.cal {
  padding: 10px;
  width: 248px;
}
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 8px;
}
.cal-title { font-size: var(--fs-13); font-weight: 600; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  text-align: center;
}
.cal-dn {
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-faint);
  padding: 4px 0;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.cal-d {
  height: 30px;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-12);
  border-radius: var(--r-2);
  cursor: pointer;
  transition: background var(--t-fast);
  font-variant-numeric: tabular-nums;
}
.cal-d:hover { background: var(--bg-hover); }
.cal-d.is-other { color: var(--text-faint); cursor: default; }
.cal-d.is-other:hover { background: transparent; }
.cal-d.is-today { color: var(--brand-500); font-weight: 700; }
.cal-d.is-selected { background: var(--brand-500); color: #fff; font-weight: 600; }

/* ───────── MODAL ───────── */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(23,25,31,.40);
  z-index: 800;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn var(--t-fast) both;
  -webkit-backdrop-filter: blur(5px) saturate(92%);
  backdrop-filter: blur(5px) saturate(92%);
}
.scrim.is-hidden { display: none; }

.modal {
  width: min(460px, 92vw);
  background: var(--bg-elev-0);
  border-radius: var(--r-5);
  box-shadow: var(--sh-3);
  border: 1px solid var(--hairline);
  display: flex; flex-direction: column;
  overflow: visible;
  animation: modalIn var(--t-base) both;
}
.modal-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: var(--fs-14); font-weight: 600; }
.modal-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { padding: 12px 16px 14px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--hairline-soft); background: var(--bg-elev-1); border-radius: 0 0 var(--r-5) var(--r-5); }

.modal-input {
  width: 100%;
  font-size: var(--fs-15);
  font-weight: 500;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  padding: 6px 0;
  border-bottom: 1.5px solid var(--hairline);
  transition: border-color var(--t-fast);
}
.modal-input:focus { border-bottom-color: var(--brand-500); }
.modal-input::placeholder { color: var(--text-faint); font-weight: 400; }

/* ───────── TOAST ───────── */
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--text);
  color: var(--bg-elev-0);
  padding: 8px 16px;
  border-radius: var(--r-pill);
  font-size: var(--fs-12);
  font-weight: 500;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  box-shadow: var(--sh-3);
  transition: opacity var(--t-base), transform var(--t-base);
  white-space: nowrap;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ───────── ANIMATIONS ───────── */
@keyframes popoverIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn   { from { opacity: 0; transform: translateY(-12px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes pop       { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes slideUp   { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ───────── SCROLLBARS ───────── */
::-webkit-scrollbar       { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: var(--r-pill); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--hairline-strong); border: 2px solid transparent; background-clip: padding-box; }

/* ───────── MONTH VIEW ───────── */
.month {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  flex: 1;
  min-height: 0;
}
.month-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--hairline);
  background: var(--bg-elev-0);
}
.month-title-grp { display: flex; align-items: center; gap: 8px; }
.month-title { font-size: var(--fs-15); font-weight: 600; }

.month-grid-head {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--bg-elev-0);
  border-bottom: 1px solid var(--hairline);
}
.month-dn {
  padding: 8px;
  font-size: var(--fs-10);
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  text-align: center;
  border-right: 1px solid var(--hairline-soft);
}
.month-dn:last-child { border-right: none; }

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: minmax(80px, 1fr);
  overflow-y: auto;
}
.month-cell {
  border-right: 1px solid var(--hairline-soft);
  border-bottom: 1px solid var(--hairline-soft);
  padding: 4px 6px 6px;
  cursor: pointer;
  transition: background var(--t-fast);
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0;
}
.month-cell:nth-child(7n) { border-right: none; }
.month-cell:hover { background: var(--bg-hover); }
.month-cell.is-other { background: var(--bg-elev-1); color: var(--text-faint); }
.month-cell.is-selected { background: var(--bg-selected); }
.month-day-num {
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
  align-self: flex-start;
  height: 22px;
  display: flex; align-items: center;
}
.month-cell.is-today .month-day-num {
  background: var(--brand-500);
  color: #fff;
  font-weight: 700;
  border-radius: 50%;
  min-width: 22px;
  justify-content: center;
}
.month-event {
  font-size: var(--fs-10);
  padding: 1px 6px;
  border-radius: var(--r-1);
  background: var(--brand-50);
  color: var(--brand-700);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
[data-theme="dark"] .month-event { background: rgba(91,108,163,.20); color: #b8c5e6; }
.month-event.is-relax   { background: var(--relax-bg);   color: var(--relax-fg); }
.month-event.is-intense { background: var(--intense-bg); color: var(--intense-fg); }
.month-event.is-done    { opacity: .55; text-decoration: line-through; }
.month-more {
  font-size: var(--fs-10);
  color: var(--text-faint);
  padding: 0 6px;
}

.month-detail {
  border-top: 1px solid var(--hairline);
  background: var(--bg-elev-0);
  padding: 12px 16px;
  max-height: 30vh;
  overflow-y: auto;
}
.month-detail-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.month-detail-title { font-size: var(--fs-13); font-weight: 600; }
.month-detail-count { font-size: var(--fs-11); color: var(--text-muted); }

/* mobile-only hidden utilities */
.only-mobile { display: none; }
.only-desktop { display: initial; }
/* ═══════════════════════════════════════════════════════════════
   wabi · extras (overrides + new components)
   Order matters — loaded AFTER app.css and mobile.css
   ═══════════════════════════════════════════════════════════════ */

/* ───────── Theme switch ───────── */
.theme-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px;
  margin-bottom: 4px;
  border-radius: var(--r-3);
  background: var(--bg-elev-0);
  border: 1px solid var(--hairline);
}
.theme-toggle-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text);
}
.theme-toggle-label i { color: var(--text-muted); }
.theme-switch { width: 46px; height: 24px; padding: 0; background: none; border: none; cursor: pointer; }
.theme-switch-track {
  display: flex; align-items: center; justify-content: space-between;
  position: relative; width: 46px; height: 24px; padding: 0 5px;
  background: var(--bg-elev-2); border: 1px solid var(--hairline);
  border-radius: var(--r-pill); transition: background var(--t-base);
}
[data-theme="dark"] .theme-switch-track { background: var(--brand-700); }
.theme-switch-icon { font-size: 10px; z-index: 1; color: var(--text-muted); transition: color var(--t-base); }
.theme-switch-icon--sun { color: #d97706; }
[data-theme="dark"] .theme-switch-icon--sun { color: var(--text-faint); }
[data-theme="dark"] .theme-switch-icon--moon { color: #fff; }
.theme-switch-thumb {
  position: absolute; left: 2px; top: 2px;
  width: 18px; height: 18px; background: #fff;
  border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform var(--t-base) cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] .theme-switch-thumb { transform: translateX(22px); background: #f0f0f3; }

/* Brand logo theme switching */
[data-theme="dark"] .brand-logo--light { display: none !important; }
[data-theme="dark"] .brand-logo--dark  { display: inline-block !important; }
.brand-logo--light { display: inline-block !important; }
.brand-logo--dark  { display: none !important; }

/* Today button */
.btn-today { font-weight: 600 !important; color: var(--brand-500) !important; }
.btn-today:hover { background: var(--brand-50) !important; }
[data-theme="dark"] .btn-today:hover { background: rgba(91,108,163,.18) !important; }

/* ───────── POPOVER over MODAL ───────── */
#modal-scrim    { z-index: 800; }
.popover        { z-index: 9500 !important; }
#popover-scrim  { z-index: 9400 !important; }

/* ───────── COMPACT POPOVERS (Renato fix — todos los popovers más chicos) ───── */
.popover {
  min-width: 160px !important;
  max-width: 240px !important;
  border-radius: var(--r-3) !important;
}
.popover-list { padding: 3px !important; }
.popover-item {
  padding: 6px 9px !important;
  font-size: 12px !important;
  gap: 6px !important;
  border-radius: var(--r-2) !important;
}
.popover-item .check { width: 11px !important; height: 11px !important; font-size: 9px !important; }
.popover-section-label { padding: 5px 9px 2px !important; font-size: 9px !important; }
.popover-divider { margin: 3px 4px !important; }

/* Compact time-presets (3-col, smaller cells) */
.time-presets--compact {
  grid-template-columns: repeat(3, 1fr) !important;
  gap: 4px !important;
  padding: 6px !important;
  width: 220px;
}
.time-presets--compact .time-preset { height: 28px !important; font-size: 12px !important; padding: 0 6px !important; }
.time-preset--clear {
  grid-column: 1 / -1;
  color: var(--text-muted) !important;
  background: transparent !important;
  font-size: 11px !important;
  height: 26px !important;
}

/* Compact calendar picker — used everywhere a date is picked */
.cal, .cal--compact {
  width: 232px !important;
  padding: 8px !important;
}
.cal-head { padding: 0 2px 6px !important; }
.cal-title { font-size: 12px !important; font-weight: 600; }
.cal-d { height: 26px !important; font-size: 11px !important; }
.cal-dn { font-size: 9px !important; padding: 3px 0 1px !important; }
.cal--compact .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal--compact .cal-d {
  aspect-ratio: 1;
  font-size: 11px;
  padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-2);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  cursor: pointer;
}
.cal--compact .cal-d:hover { background: var(--bg-hover); }
.cal--compact .cal-d.is-today { font-weight: 700; color: var(--brand-500); }
.cal--compact .cal-d.is-selected { background: var(--brand-500); color: #fff; }
.cal--compact .cal-d.is-other { visibility: hidden; }
.cal--compact .cal-dn {
  font-size: 9px; font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  text-align: center; padding: 4px 0 2px;
  letter-spacing: .04em;
}
.cal-quick {
  display: flex; gap: 4px;
  margin-top: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--hairline-soft);
}
.cal-quick-btn {
  flex: 1;
  height: 26px;
  border: 1px solid var(--hairline);
  background: transparent;
  border-radius: var(--r-2);
  font-size: 11px;
  color: var(--text);
  cursor: pointer;
  transition: background var(--t-fast);
}
.cal-quick-btn:hover { background: var(--bg-hover); }

/* ───────── BLOCK SECTION — keep cards inside their block ─────────
   No internal scroll: cards must be compact enough to all fit.
   The card density + meta hidden when crowded keeps things inside. */
.block-section {
  pointer-events: none;
  display: flex !important;
  flex-direction: column !important;
  padding: 3px 5px !important;
  gap: 3px !important;
}
.block-section > * { pointer-events: auto; }
.block-section .block-label { flex-shrink: 0; }
.block-section .tasks-stack {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
}
.block-section .task-card {
  flex-shrink: 0;
  padding: 5px 7px 5px 10px !important;
  border-radius: var(--r-2) !important;
}
.block-section .task-card .task-row { align-items: center; gap: 6px; }
.block-section .task-card .task-check {
  width: 13px !important; height: 13px !important;
  margin-top: 0 !important;
  border-width: 1.5px !important;
}
.block-section .task-card .task-check.is-done::after {
  width: 6px !important; height: 3px !important;
}
.block-section .task-card .task-title {
  font-size: 11px !important;
  line-height: 1.3 !important;
  font-weight: 500 !important;
}
.block-section .task-card .task-meta {
  margin-top: 2px;
  margin-left: 19px;
  gap: 3px !important;
}
.block-section .task-card .task-meta .tag,
.block-section .task-card .task-meta .chip-mini {
  font-size: 9px !important;
  padding: 0 4px !important;
}
/* Card actions (delete) — keep inside the card, never overflow */
.block-section .card-actions { top: 1px !important; right: 1px !important; }
.block-section .btn-card-action { width: 18px !important; height: 18px !important; font-size: 9px !important; }

/* ───────── DETAIL panel — desktop floating card ───────── */
@media (min-width: 769px) {
  .detail { display: none !important; }
  .detail.is-open {
    display: flex !important;
    position: fixed !important;
    top: 64px;
    right: 16px;
    bottom: 16px;
    left: auto !important;
    width: 400px !important;
    max-width: calc(100vw - 32px);
    background: var(--bg-elev-0) !important;
    border: 1px solid var(--hairline) !important;
    border-radius: var(--r-5) !important;
    box-shadow: 0 24px 60px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.08) !important;
    overflow: hidden;
    z-index: 750;
    animation: detailIn 200ms cubic-bezier(.2,.8,.2,1) both;
  }
  .detail-header { background: var(--bg-elev-0) !important; border-radius: var(--r-5) var(--r-5) 0 0; }
  .detail-footer { border-radius: 0 0 var(--r-5) var(--r-5); }
  body.detail-open::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(0,0,0,.18);
    z-index: 740;
    animation: fadeIn 200ms both;
    -webkit-backdrop-filter: blur(1px);
    backdrop-filter: blur(1px);
  }
}
@keyframes detailIn {
  from { opacity: 0; transform: translateX(12px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

/* Mobile sidebar footer spacing */
.sidebar-footer { gap: 4px; }

/* Mobile: hide swipe bg unless swiped */
@media (max-width: 768px) {
  .agenda-task-content { cursor: pointer; }
  .agenda-task:not(.swiped) .agenda-task-swipe-bg { display: none; }
}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE — multi-breakpoint
   Goal: smooth scaling from ~360px to ≥1600px, no awkward gaps
   ═══════════════════════════════════════════════════════════════ */

/* Small phone (≤380) — tighter type, narrower padding */
@media (max-width: 380px) {
  .titlebar { padding: 0 8px !important; }
  .mode-pill .mode-label { display: none; }
  .mode-pill { padding: 0 8px !important; min-width: 32px; }
  .mobile-subheader { padding: 8px 10px !important; }
  .agenda { padding: 8px 10px 80px !important; }
  .agenda-block-name { font-size: 11px !important; }
  .agenda-task .task-title { font-size: 14px !important; }
  .day-pill { min-width: 44px !important; }
  .modal { padding: 14px !important; }
  .meta-chip { font-size: 11px !important; padding: 5px 9px !important; }
}

/* Phone landscape / phablet (480-768) */
@media (min-width: 481px) and (max-width: 768px) {
  .agenda { max-width: 540px; margin: 0 auto; }
  .modal { max-width: 480px !important; margin: 0 auto; border-radius: var(--r-5) !important; }
}

/* Tablet portrait (769-960) — desktop chrome but tighter */
@media (min-width: 769px) and (max-width: 960px) {
  :root {
    --sidebar-w: 184px;
    --row-h: 40px;
  }
  .titlebar { padding: 0 12px !important; gap: 6px; }
  .titlebar-left { gap: 6px !important; }
  .seg-btn { padding: 0 8px !important; font-size: 11px !important; }
  .day-name { font-size: 10px !important; }
  .day-num  { font-size: 14px !important; }
  .task-title { font-size: 11px !important; }
  .chip-mini, .tag { font-size: 9px !important; }
  .gutter-cell { font-size: 9px !important; padding: 0 4px; }
  .detail.is-open { width: 340px !important; top: 56px; }
  #current-date { font-size: 12px; min-width: 110px !important; }
}

/* Tablet landscape (961-1199) */
@media (min-width: 961px) and (max-width: 1199px) {
  :root { --sidebar-w: 200px; }
  .detail.is-open { width: 380px !important; }
}

/* Wide desktop (≥1440) — let columns expand fully, no max-width cap */
@media (min-width: 1440px) {
  :root {
    --sidebar-w: 240px;
    --row-h: 48px;
  }
  .detail.is-open { width: 440px !important; }
}

/* Ultra-wide (≥1920) */
@media (min-width: 1920px) {
  :root {
    --sidebar-w: 264px;
    --row-h: 52px;
  }
  .detail.is-open { width: 500px !important; }
}

/* ───────── RESPONSIVE: ensure month grid stays usable ───────── */
@media (max-width: 768px) {
  .month-grid { grid-auto-rows: minmax(56px, 1fr); }
  .month-cell { padding: 2px 4px 4px !important; }
  .month-day-num { font-size: 11px !important; height: 18px !important; }
  .month-event { font-size: 9px !important; padding: 0 4px !important; }
  .month-more { font-size: 9px !important; padding: 0 4px !important; }
  .month-toolbar { padding: 8px 12px !important; flex-wrap: wrap; gap: 8px; }
  .month-title { font-size: 14px !important; }
}

/* Detail floating card — give the body proper scroll on short screens */
@media (min-width: 769px) and (max-height: 700px) {
  .detail.is-open { top: 12px; bottom: 12px; }
}

/* ═══════════════════════════════════════════════════════════════
   FULL-WIDTH BOARD (Renato fix)
   Force grid columns to expand and fill all available horizontal space
   on every desktop breakpoint, no awkward gaps on big screens.
   ═══════════════════════════════════════════════════════════════ */
@media (min-width: 769px) {
  .board { width: 100%; }
  .board-headers,
  .board-body {
    grid-template-columns: var(--gutter-w) repeat(7, 1fr) !important;
    width: 100%;
    min-width: 0;
  }
  .board-body { overflow-x: hidden; }
  .day-col { min-width: 0; }
}

/* ───────── Hour rows: continuous block color (no internal seam) ─────────
   Renato: the 11AM / 5PM rows must look the same colour as the rest
   of their block. The hairline between rows of the same block is what
   was making them look different. Suppress it within blocks. */
.gutter-cell.blk-a + .gutter-cell.blk-a,
.gutter-cell.blk-b + .gutter-cell.blk-b,
.gutter-cell.blk-c + .gutter-cell.blk-c,
.gutter-cell.blk-d + .gutter-cell.blk-d {
  border-top: 1px solid transparent;
  margin-top: -1px; /* swallow the previous border-bottom seam visually */
}
.hour-row.blk-a + .hour-row.blk-a,
.hour-row.blk-b + .hour-row.blk-b,
.hour-row.blk-c + .hour-row.blk-c,
.hour-row.blk-d + .hour-row.blk-d {
  border-top: 1px solid transparent;
  margin-top: -1px;
}
/* Make sure the FIRST hour of a block has its color start crisp */
.gutter-cell.blk-a, .gutter-cell.blk-b, .gutter-cell.blk-c, .gutter-cell.blk-d,
.hour-row.blk-a, .hour-row.blk-b, .hour-row.blk-c, .hour-row.blk-d {
  border-bottom-color: transparent !important;
}
/* Re-add a single seam between DIFFERENT blocks (a→b, b→c, etc.) */
.gutter-cell.blk-a + .gutter-cell.blk-b,
.gutter-cell.blk-b + .gutter-cell.blk-c,
.gutter-cell.blk-c + .gutter-cell.blk-d,
.gutter-cell.blk-d + .gutter-cell.blk-a,
.gutter-cell:not([class*="blk-"]) + .gutter-cell.blk-a,
.gutter-cell.blk-a + .gutter-cell:not([class*="blk-"]),
.gutter-cell.blk-b + .gutter-cell:not([class*="blk-"]),
.gutter-cell.blk-c + .gutter-cell:not([class*="blk-"]),
.gutter-cell.blk-d + .gutter-cell:not([class*="blk-"]) {
  border-top: 1px solid var(--hairline);
  margin-top: 0;
}
.hour-row.blk-a + .hour-row.blk-b,
.hour-row.blk-b + .hour-row.blk-c,
.hour-row.blk-c + .hour-row.blk-d,
.hour-row.blk-d + .hour-row.blk-a,
.hour-row:not([class*="blk-"]) + .hour-row.blk-a,
.hour-row.blk-a + .hour-row:not([class*="blk-"]),
.hour-row.blk-b + .hour-row:not([class*="blk-"]),
.hour-row.blk-c + .hour-row:not([class*="blk-"]),
.hour-row.blk-d + .hour-row:not([class*="blk-"]) {
  border-top: 1px solid var(--hairline);
  margin-top: 0;
}
/* ═══════════════════════════════════════════════════════════════
   wabi · mobile (≤768px)
   App-native feel: bottom sheets, full-screen views, tab bar.
   ═══════════════════════════════════════════════════════════════ */

@media (max-width: 768px) {
  :root {
    --sidebar-w: 0px;
    --header-h: 52px;
    --gutter-w: 0px;     /* mobile uses agenda layout, not grid */
    --row-h: 52px;
    --detail-w: 100%;
  }

  body { font-size: var(--fs-14); }

  /* Hide desktop chrome */
  .only-desktop { display: none !important; }
  .only-mobile { display: initial; }
  .only-mobile.flex { display: flex; }

  .app {
    grid-template-rows: var(--header-h) 1fr var(--tabbar-h);
  }

  /* Titlebar morphs into mobile nav bar */
  .titlebar {
    background: var(--bg-elev-0);
    border-bottom: 1px solid var(--hairline);
    padding: 0 12px;
    gap: 8px;
  }
  .titlebar-left { gap: 8px; }
  .titlebar-right { gap: 4px; }
  .brand-mark { padding: 0; }
  .brand-logo { height: 16px; }
  .btn-burger {
    display: flex;
    width: 32px; height: 32px;
    align-items: center; justify-content: center;
    color: var(--text);
    border-radius: var(--r-2);
    font-size: 16px;
  }
  .btn-burger:hover { background: var(--bg-hover); }
  .current-date { display: none; }
  .date-nav { display: none; }
  .seg { display: none; }
  .mode-pill {
    height: 30px;
    padding: 0 10px;
  }

  /* Main is now full width — sidebar overlays */
  .main {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 84vw;
    max-width: 320px;
    z-index: 800;
    transform: translateX(-100%);
    transition: transform var(--t-base);
    box-shadow: var(--sh-3);

  border-right:1px solid var(--glass-stroke)!important;
  border-radius:18px;
  background:var(--glass-soft)!important;
  box-shadow:var(--glass-shadow-soft);
  -webkit-backdrop-filter:blur(26px) saturate(165%);
  backdrop-filter:blur(26px) saturate(165%);
}
.sidebar-section{padding:14px 10px 5px!important;font-size:9px!important;letter-spacing:.075em!important;}
.nav-item{min-height:34px;padding:7px 10px!important;border-radius:10px!important;gap:9px!important;}
.nav-item:hover{background:rgba(255,255,255,.42)!important;}
[data-theme="dark"] .nav-item:hover{background:rgba(255,255,255,.06)!important;}
.nav-item.is-active{
  background:rgba(91,108,163,.14)!important;
  box-shadow:inset 0 0 0 1px rgba(91,108,163,.08);
}
.nav-item .nav-icon{font-size:12px!important;width:17px!important;}
.content{padding:10px 10px 10px 8px;}
.board,.month{
  border:1px solid var(--glass-stroke);
  border-radius:18px;
  background:rgba(255,255,255,.34);
  box-shadow:var(--glass-shadow-soft);
  overflow:hidden!important;
  -webkit-backdrop-filter:blur(14px) saturate(130%);
  backdrop-filter:blur(14px) saturate(130%);
}
[data-theme="dark"] .board,[data-theme="dark"] .month{background:rgba(28,28,32,.38);}
.board-headers,.month-toolbar,.month-grid-head{
  background:var(--glass)!important;
  border-color:var(--glass-stroke)!important;
  -webkit-backdrop-filter:blur(24px) saturate(165%);
  backdrop-filter:blur(24px) saturate(165%);
}
.day-head{padding:8px 10px 9px!important;border-color:rgba(0,0,0,.055)!important;}
[data-theme="dark"] .day-head{border-color:rgba(255,255,255,.05)!important;}
.day-name{font-size:9px!important;letter-spacing:.07em!important;}
.day-num{font-size:15px!important;font-weight:650!important;}
.day-num--today{background:var(--brand-500)!important;box-shadow:0 3px 10px rgba(91,108,163,.28);}
.day-progress{opacity:.72;}
.gutter{background:rgba(255,255,255,.34)!important;}
[data-theme="dark"] .gutter{background:rgba(28,28,32,.36)!important;}
.gutter-cell,.block-section,.day-col{border-color:rgba(0,0,0,.055)!important;}
[data-theme="dark"] .gutter-cell,[data-theme="dark"] .block-section,[data-theme="dark"] .day-col{border-color:rgba(255,255,255,.055)!important;}
.block-section{padding:5px!important;transition:box-shadow .18s var(--spring),filter .18s var(--spring),transform .18s var(--spring)!important;}
.block-label{
  width:100%!important;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:5px;
  border:0!important;
  background:transparent!important;
  opacity:.78!important;
  padding:0 2px!important;
  margin-bottom:4px!important;
  font-size:8.5px!important;
}
.wabi-capacity{font-weight:600;text-transform:none;letter-spacing:0;opacity:.8;white-space:nowrap;}
.tasks-stack{border-radius:10px;transition:background .16s var(--spring),box-shadow .16s var(--spring);}
.task-card{
  background:rgba(255,255,255,.66)!important;
  border:1px solid rgba(255,255,255,.74)!important;
  border-radius:11px!important;
  box-shadow:0 2px 8px rgba(31,38,61,.075),inset 0 1px 0 rgba(255,255,255,.7)!important;
  -webkit-backdrop-filter:blur(16px) saturate(145%);
  backdrop-filter:blur(16px) saturate(145%);
  cursor:grab!important;
  user-select:none;
}
[data-theme="dark"] .task-card{background:rgba(43,43,49,.72)!important;border-color:rgba(255,255,255,.08)!important;box-shadow:0 2px 9px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)!important;}
.task-card:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(31,38,61,.12),inset 0 1px 0 rgba(255,255,255,.72)!important;}
.task-card:active{cursor:grabbing!important;transform:scale(.992);}
.task-card.wabi-dragging{opacity:.52;transform:scale(.98);}
.task-card.is-fixed::after{
  content:'◆';position:absolute;top:5px;right:7px;font-size:6px;color:var(--brand-500);opacity:.8;
}
.task-card.is-external::after{content:'↗';font-size:9px;}
.task-title{letter-spacing:-.012em;}
.task-time-hint{font-size:8.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto;padding-left:5px;}
.task-fixed-time{font-weight:650;color:var(--brand-600);}
[data-theme="dark"] .task-fixed-time{color:var(--brand-300);}
.wabi-drop-ok{box-shadow:inset 0 0 0 2px rgba(31,157,98,.42)!important;filter:saturate(1.06);}
.wabi-drop-no{box-shadow:inset 0 0 0 2px rgba(217,63,63,.35)!important;filter:saturate(.72);}
.fab{
  width:48px!important;height:48px!important;right:22px!important;bottom:22px!important;
  border:1px solid rgba(255,255,255,.38)!important;
  box-shadow:0 12px 30px rgba(91,108,163,.34),inset 0 1px 0 rgba(255,255,255,.34)!important;
}
.detail.is-open{
  background:var(--glass-strong)!important;
  border-color:var(--glass-stroke)!important;
  border-radius:20px!important;
  box-shadow:var(--glass-shadow)!important;
  -webkit-backdrop-filter:blur(30px) saturate(175%);
  backdrop-filter:blur(30px) saturate(175%);
}
.detail-header,.detail-footer{background:transparent!important;border-color:var(--hairline-soft)!important;}
.timer-card,.meta-chip,.modal,.popover{
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
}
.timer-card{background:rgba(255,255,255,.38)!important;border-color:var(--glass-stroke)!important;border-radius:13px!important;}
[data-theme="dark"] .timer-card{background:rgba(255,255,255,.045)!important;}
.meta-chip{border-radius:999px!important;background:rgba(255,255,255,.42)!important;border-color:var(--glass-stroke)!important;}
[data-theme="dark"] .meta-chip{background:rgba(255,255,255,.05)!important;}
.popover,.modal{
  background:var(--glass-strong)!important;
  border-color:var(--glass-stroke)!important;
  box-shadow:var(--glass-shadow)!important;
}
.scrim{background:rgba(18,19,25,.28)!important;-webkit-backdrop-filter:blur(14px) saturate(120%)!important;backdrop-filter:blur(14px) saturate(120%)!important;}
.toast{background:rgba(22,22,27,.86)!important;color:#fff!important;backdrop-filter:blur(18px) saturate(160%);box-shadow:0 10px 30px rgba(0,0,0,.2)!important;}

/* Account button */
.wabi-account-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand-400),var(--brand-600));color:#fff;font-weight:700;font-size:11px;box-shadow:0 3px 10px rgba(91,108,163,.28),inset 0 1px 0 rgba(255,255,255,.25);margin-left:2px;transition:transform .16s var(--spring),box-shadow .16s var(--spring);}
.wabi-account-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(91,108,163,.34),inset 0 1px 0 rgba(255,255,255,.28);}

/* Authentication + first-run */
.wabi-auth-layer{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(circle at 20% 10%,rgba(91,108,163,.22),transparent 36%),
  radial-gradient(circle at 80% 90%,rgba(197,172,220,.18),transparent 34%),
  rgba(245,245,247,.88);-webkit-backdrop-filter:blur(34px) saturate(155%);backdrop-filter:blur(34px) saturate(155%);}
[data-theme="dark"] .wabi-auth-layer{background:radial-gradient(circle at 20% 10%,rgba(91,108,163,.22),transparent 36%),rgba(18,18,21,.91);}
.wabi-auth-layer.is-visible{display:flex;animation:wabiFade .3s both;}
.wabi-auth-card{width:min(440px,94vw);border:1px solid var(--glass-stroke);background:var(--glass);box-shadow:var(--glass-shadow);border-radius:28px;padding:30px;-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);}
.wabi-auth-brand{text-align:center;margin-bottom:26px;}
.wabi-auth-logo{font-family:var(--font-serif);font-size:35px;font-weight:650;letter-spacing:-.035em;}
.wabi-auth-logo span{color:var(--brand-500);}
.wabi-auth-kicker{font-size:12px;color:var(--text-muted);margin-top:6px;}
.wabi-auth-title{font-size:25px;font-weight:700;letter-spacing:-.035em;text-align:center;margin-bottom:7px;}
.wabi-auth-copy{font-size:13px;color:var(--text-muted);text-align:center;line-height:1.55;margin:0 auto 22px;max-width:330px;}
.wabi-provider{width:100%;height:46px;border:1px solid var(--hairline);border-radius:13px;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600;margin-top:9px;box-shadow:0 1px 4px rgba(0,0,0,.045);transition:background .15s,transform .1s;}
[data-theme="dark"] .wabi-provider{background:rgba(255,255,255,.06);}
.wabi-provider:hover{background:var(--glass-strong);}
.wabi-provider:active{transform:scale(.992);}
.wabi-provider-mark{width:21px;height:21px;display:grid;place-items:center;font-size:14px;font-weight:800;}
.wabi-provider-mark.apple{font-size:19px;}
.wabi-auth-divider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 14px;}
.wabi-auth-divider::before,.wabi-auth-divider::after{content:'';height:1px;flex:1;background:var(--hairline-soft);}
.wabi-field{display:flex;flex-direction:column;gap:6px;margin:12px 0;}
.wabi-field label,.wabi-mini-label{font-size:10px;font-weight:650;color:var(--text-muted);text-transform:uppercase;letter-spacing:.065em;}
.wabi-input,.wabi-select{width:100%;height:42px;border:1px solid var(--hairline);border-radius:11px;background:rgba(255,255,255,.55);padding:0 12px;color:var(--text);outline:none;transition:border .15s,box-shadow .15s;}
[data-theme="dark"] .wabi-input,[data-theme="dark"] .wabi-select{background:rgba(255,255,255,.055);}
.wabi-input:focus,.wabi-select:focus{border-color:rgba(91,108,163,.62);box-shadow:0 0 0 3px rgba(91,108,163,.12);}
.wabi-auth-primary{width:100%;height:44px;border-radius:12px;background:var(--brand-500);color:#fff;font-weight:650;margin-top:8px;box-shadow:0 8px 20px rgba(91,108,163,.25),inset 0 1px 0 rgba(255,255,255,.25);}
.wabi-auth-primary:hover{background:var(--brand-600);}
.wabi-auth-secondary{width:100%;height:40px;color:var(--text-muted);font-weight:550;margin-top:5px;}
.wabi-auth-error{font-size:11px;color:var(--danger-500);min-height:15px;margin-top:5px;}
.wabi-steps{display:flex;justify-content:center;gap:5px;margin:4px 0 22px;}
.wabi-step-dot{width:6px;height:6px;border-radius:50%;background:var(--hairline-strong);}
.wabi-step-dot.on{width:18px;border-radius:999px;background:var(--brand-500);}
.wabi-choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0;}
.wabi-choice{min-height:70px;padding:10px 8px;border:1px solid var(--hairline);border-radius:14px;background:rgba(255,255,255,.38);text-align:center;}
.wabi-choice strong{display:block;font-size:12px;margin-top:6px;}
.wabi-choice small{font-size:10px;color:var(--text-muted);}
.wabi-choice.is-selected{border-color:rgba(91,108,163,.45);background:rgba(91,108,163,.13);box-shadow:inset 0 0 0 1px rgba(91,108,163,.08);}
.wabi-onb-connect{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--hairline);border-radius:13px;margin-top:8px;background:rgba(255,255,255,.3);}
.wabi-onb-connect span{font-weight:600;font-size:12px;}
.wabi-onb-connect button{font-size:11px;color:var(--brand-600);font-weight:650;padding:6px 9px;border-radius:8px;background:rgba(91,108,163,.1);}

/* Create task v2 */
.wabi-create{width:min(590px,94vw);max-height:min(760px,92vh);overflow:auto;background:var(--glass-strong);border:1px solid var(--glass-stroke);border-radius:22px;box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(30px) saturate(175%);backdrop-filter:blur(30px) saturate(175%);animation:wabiSheetIn .24s var(--spring) both;}
.wabi-create-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 12px;position:sticky;top:0;background:var(--glass-strong);backdrop-filter:blur(24px);z-index:2;}
.wabi-create-head h2{font-size:17px;letter-spacing:-.02em;}
.wabi-create-body{padding:4px 20px 18px;}
.wabi-title-input{width:100%;border:0;border-bottom:1px solid var(--hairline);background:transparent;font-size:24px;font-weight:650;letter-spacing:-.035em;padding:8px 2px 12px;outline:none;margin-bottom:15px;color:var(--text);}
.wabi-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;}
.wabi-segment{display:flex;padding:3px;border:1px solid var(--hairline);border-radius:12px;background:rgba(0,0,0,.035);gap:2px;}
[data-theme="dark"] .wabi-segment{background:rgba(255,255,255,.035);}
.wabi-segment button{flex:1;height:32px;border-radius:9px;font-size:11.5px;color:var(--text-muted);font-weight:600;}
.wabi-segment button.is-selected{background:var(--glass-strong);color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.1);}
.wabi-reminders{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.wabi-reminder-chip{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--hairline);font-size:11px;color:var(--text-muted);background:rgba(255,255,255,.28);}
.wabi-reminder-chip.on{color:var(--brand-700);border-color:rgba(91,108,163,.35);background:rgba(91,108,163,.12);}
[data-theme="dark"] .wabi-reminder-chip.on{color:var(--brand-300);}
.wabi-fixed-row{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
.wabi-fixed-row.on{display:grid;}
.wabi-create-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 20px 18px;border-top:1px solid var(--hairline-soft);}
.wabi-create-error{font-size:11px;color:var(--danger-500);line-height:1.35;min-height:15px;}
.wabi-btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--hairline);font-weight:600;font-size:12px;background:var(--glass-soft);}
.wabi-btn.primary{background:var(--brand-500);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(91,108,163,.22);}
.wabi-btn.danger{color:var(--danger-500);}
.wabi-close{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.055);font-size:17px;color:var(--text-muted);}
[data-theme="dark"] .wabi-close{background:rgba(255,255,255,.07);}

/* Detail planner extension */
.wabi-detail-plan{padding-top:2px;}
.wabi-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.wabi-detail-card{padding:10px;border-radius:12px;background:rgba(255,255,255,.32);border:1px solid var(--glass-stroke);}
[data-theme="dark"] .wabi-detail-card{background:rgba(255,255,255,.035);}
.wabi-detail-card label{font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:650;display:block;margin-bottom:5px;}
.wabi-inline-select{width:100%;border:0;background:transparent;color:var(--text);font-size:12px;font-weight:600;outline:none;}
.wabi-lock-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--brand-600);font-weight:650;background:rgba(91,108,163,.1);padding:4px 8px;border-radius:999px;}

/* Settings */
.wabi-settings-scrim{position:fixed;inset:0;z-index:16000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(17,18,24,.25);backdrop-filter:blur(16px) saturate(125%);}
.wabi-settings-scrim.on{display:flex;animation:wabiFade .2s both;}
.wabi-settings{width:min(880px,95vw);height:min(680px,90vh);display:grid;grid-template-columns:220px 1fr;overflow:hidden;border:1px solid var(--glass-stroke);border-radius:24px;background:var(--glass-strong);box-shadow:var(--glass-shadow);backdrop-filter:blur(32px) saturate(175%);}
.wabi-settings-nav{padding:18px 12px;background:rgba(91,108,163,.055);border-right:1px solid var(--hairline-soft);display:flex;flex-direction:column;}
.wabi-settings-person{padding:4px 8px 18px;}
.wabi-settings-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand-400),var(--brand-700));color:#fff;font-size:14px;font-weight:750;margin-bottom:8px;}
.wabi-settings-person strong{font-size:13px;display:block;}
.wabi-settings-person small{font-size:10.5px;color:var(--text-muted);}
.wabi-settings-tab{width:100%;height:36px;border-radius:10px;text-align:left;padding:0 10px;font-size:12px;color:var(--text-muted);font-weight:550;margin:1px 0;}
.wabi-settings-tab.on{background:rgba(91,108,163,.13);color:var(--text);font-weight:650;}
.wabi-settings-nav-bottom{margin-top:auto;}
.wabi-settings-main{overflow:auto;padding:24px 28px 34px;}
.wabi-settings-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.wabi-settings-top h2{font-size:23px;letter-spacing:-.03em;}
.wabi-settings-section{max-width:620px;}
.wabi-settings-group{margin:18px 0 24px;}
.wabi-settings-group h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:8px;}
.wabi-settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 13px;border-bottom:1px solid var(--hairline-soft);background:rgba(255,255,255,.24);}
[data-theme="dark"] .wabi-settings-row{background:rgba(255,255,255,.025);}
.wabi-settings-row:first-of-type{border-radius:13px 13px 0 0;}
.wabi-settings-row:last-of-type{border-bottom:0;border-radius:0 0 13px 13px;}
.wabi-settings-row:only-of-type{border-radius:13px;}
.wabi-settings-row strong{display:block;font-size:12px;}
.wabi-settings-row small{display:block;color:var(--text-muted);font-size:10.5px;margin-top:2px;line-height:1.35;}
.wabi-integration{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:12px;border:1px solid var(--hairline-soft);border-radius:14px;margin:8px 0;background:rgba(255,255,255,.24);}
.wabi-integration-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(91,108,163,.1);font-weight:800;color:var(--brand-600);}
.wabi-integration strong{font-size:12px;display:block;}
.wabi-integration small{font-size:10.5px;color:var(--text-muted);}
.wabi-status{font-size:10px;color:var(--success-500);font-weight:650;margin-right:6px;}
.wabi-plan-card{border:1px solid rgba(91,108,163,.2);background:linear-gradient(145deg,rgba(91,108,163,.13),rgba(255,255,255,.2));border-radius:18px;padding:18px;}
.wabi-plan-badge{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-600);font-weight:750;}
.wabi-plan-title{font-size:20px;font-weight:750;letter-spacing:-.025em;margin:5px 0;}
.wabi-plan-copy{font-size:11px;color:var(--text-muted);line-height:1.45;margin-bottom:14px;}
.wabi-danger-zone{border:1px solid rgba(217,63,63,.2);background:rgba(217,63,63,.035);border-radius:16px;padding:14px;}
.wabi-delete-code{font-family:var(--font-mono);font-weight:750;letter-spacing:.08em;color:var(--danger-500);}
.wabi-toggle{width:42px;height:24px;border-radius:999px;background:var(--hairline-strong);padding:2px;transition:background .18s;}
.wabi-toggle::after{content:'';display:block;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .18s var(--spring);}
.wabi-toggle.on{background:var(--brand-500);}.wabi-toggle.on::after{transform:translateX(18px);}


/* Mobile */
@media(max-width:768px){
  .titlebar{height:52px!important;padding:0 10px!important;}
  .titlebar .brand-tagline{display:none;}
  .main{display:block!important;}
  .content{padding:8px 8px 84px!important;}
  .board,.month{border-radius:16px;}
  .sidebar{margin:0!important;border-radius:0 18px 18px 0!important;}
  .tabbar{
    left:12px!important;right:12px!important;bottom:calc(10px + env(safe-area-inset-bottom,0px))!important;
    width:auto!important;height:58px!important;padding:5px!important;border:1px solid var(--glass-stroke)!important;border-radius:19px!important;
    background:var(--glass)!important;box-shadow:var(--glass-shadow)!important;
    -webkit-backdrop-filter:blur(28px) saturate(185%)!important;backdrop-filter:blur(28px) saturate(185%)!important;
  }
  .tabbar-btn{border-radius:14px!important;}
  .tabbar-btn.is-active{background:rgba(91,108,163,.12);}
  .wabi-auth-card{padding:24px 20px;border-radius:24px;}
  .wabi-auth-title{font-size:22px;}
  .wabi-form-grid{grid-template-columns:1fr;}
  .wabi-create{width:100vw;max-width:none;max-height:92dvh;border-radius:24px 24px 0 0;position:absolute;bottom:0;}
  .wabi-create-scrim{align-items:flex-end!important;padding:0!important;}
  .wabi-settings-scrim{padding:0;align-items:flex-end;}
  .wabi-settings{width:100%;height:94dvh;grid-template-columns:1fr;border-radius:24px 24px 0 0;display:block;}
  .wabi-settings-nav{display:flex;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hairline-soft);padding:10px;gap:4px;}
